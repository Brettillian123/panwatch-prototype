name: Build check

on:
  push:
    branches: [ci-build, 'ci-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          sw_vers

      - name: Core unit tests
        run: swift test

      - name: Build the iPhone app, unsigned
        run: |
          xcodebuild -project PanWatch.xcodeproj -target PanWatch -sdk iphoneos \
            -configuration Debug CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check the alarm permission text is in the app
        run: plutil -extract NSAlarmKitUsageDescription raw build/Debug-iphoneos/PanWatch.app/Info.plist

      - name: List the app's extensions
        run: ls -la build/Debug-iphoneos/PanWatch.app/PlugIns 2>/dev/null || echo "no PlugIns folder"

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
